# ptp4l slave configuration for the A1 host PC.
#
# Topology: TM2000A (GPS PTP grandmaster) and PandarXT are on the same L2
# segment (192.168.1.0/24). The LiDAR follows the TM2000A directly. This PC
# only follows the TM2000A as a slave; it never acts as a master.
#
# Values below mirror the PandarXT PTP settings recorded in
# docs/pandarxt_setup.md so that all three devices share one PTP domain:
#   profile 1588v2 (default E2E), transport UDP/IPv4, domain 0.
#
# The host NIC (eno1, Realtek RTL8168, driver r8169) has no PTP hardware
# clock, so software timestamping is used and ptp4l disciplines the system
# clock (CLOCK_REALTIME) directly. phc2sys is NOT needed in this mode.
#
# Usage (linuxptp 3.1.1, Ubuntu 22.04):
#   sudo apt install linuxptp
#   sudo systemctl stop systemd-timesyncd     # avoid two services steering the clock
#   sudo ptp4l -f system/ptp4l-slave.conf -i eno1 -m
# Verify:
#   sudo pmc -u -b 0 'GET TIME_STATUS_NP'       # master_offset should settle < ~100 us
#   sudo pmc -u -b 0 'GET TIME_PROPERTIES_DATA_SET'   # currentUtcOffset 37, timeTraceable 1

[global]
# Never become master; the TM2000A is the only time source.
slaveOnly               1

# Must match the LiDAR and the TM2000A.
domainNumber            0
network_transport       UDPv4
delay_mechanism         E2E

# Software timestamping: the NIC has no PHC.
time_stamping           software

# Message rates. The slave adopts the master's sync rate; these only set
# what this node would use and the delay-request rate it asks for.
logAnnounceInterval     1
logSyncInterval         1
logMinDelayReqInterval  0

# PTP carries TAI. ptp4l converts to UTC for CLOCK_REALTIME using the
# master's currentUtcOffset when the master flags it valid; this is the
# fallback if it does not (TAI - UTC = 37 s as of 2017-01-01, unchanged).
utc_offset              37

# Allow a large first correction (the PC may be far off before lock),
# then keep servo steps small.
step_threshold          1.0
first_step_threshold    0.00002

# Log a summary line once per second on the console (-m).
summary_interval        0
